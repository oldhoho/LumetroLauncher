name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 默认包列表含已废弃的 `tools`，会导致 sdkmanager 报 Failed to find package 'tools'，改为项目实际需要的有效包
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # gradle.properties 里的 aapt2FromMavenOverride 指向 AndroidIDE 设备路径，CI 上不存在会构建失败，先移除
      - name: Remove AndroidIDE-only aapt2 override
        run: sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure signing keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lumetro.p12"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/lumetro.p12"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lumetro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
